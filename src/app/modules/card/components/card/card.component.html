<button
    type="button"
    class="card"
    [class.card--image]="isImageCard"
    [class.card-back]="isFlipEffect && !card.match && !card.selected"
    [class.highlight-card]="card.selected"
    [class.matched-card]="card.match"
    [disabled]="card.match"
    (click)="selectCard.emit(card)">
    @if (card.match) {
        <span class="card-state">
            <i class="pi pi-check-circle"></i>
        </span>
    }

    @if (isImageCard) {
        @if (isHiddenByFlipEffect) {
            <span class="card-image-back" aria-hidden="true">
                <i class="pi pi-image"></i>
            </span>
        } @else {
            <img
                class="card-image"
                [src]="card.imagePath"
                [alt]="card.value">
        }
    } @else {
        <span class="card-value">
            {{ isHiddenByFlipEffect ? '•••' : card.value }}
        </span>
    }
</button>
